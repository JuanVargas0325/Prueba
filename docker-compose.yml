# Despliegue local.
#   1. cp .env.example .env   (y ajustar los valores)
#   2. docker compose up --build -d
#   3. La API queda disponible en http://localhost:8080 a través de Nginx.

name: seguimiento

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Para conectarse desde una herramienta local (DBeaver, pgAdmin), descomente:
    # ports:
    #   - "5433:5432"

  api:
    build:
      context: ./backend
      target: api
    image: seguimiento-api:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      ALMACENAMIENTO_RUTA: /data
    volumes:
      - archivos:/data
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    ports:
      - "${NGINX_PUERTO:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  datos-postgres:
  archivos:
