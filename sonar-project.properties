# Configuración del análisis de SonarQube (lo ejecuta el workflow de CI).
# TODO equipo: reemplazar los valores marcados con CAMBIAR.
sonar.projectKey=CAMBIAR_clave-del-proyecto
# Solo para SonarQube Cloud (sonarcloud.io):
# sonar.organization=CAMBIAR_organizacion
sonar.projectName=Plataforma de seguimiento de monitores y asistentes
sonar.sourceEncoding=UTF-8

sonar.sources=backend
sonar.exclusions=**/*_test.go,**/vendor/**,backend/internal/basedatos/migraciones/**
sonar.tests=backend
sonar.test.inclusions=**/*_test.go

# Reporte de cobertura generado por: go test -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=backend/coverage.out
# El arranque (main) se valida con las pruebas de extremo a extremo, no con pruebas unitarias.
sonar.coverage.exclusions=backend/cmd/**
